# Helm values for the staging release of leafy-ev-charging (mongodb/web-app chart).
# Single pod: frontend = main container (ingress on 8080), backend + simulator = sidecars.
# MongoDB runs on Atlas (no in-cluster mongo). The Atlas connection string is a
# Kanopy ksec secret named "leafy-ev-charging" with key MONGODB_URI.

# Non-secret config for the main container (frontend).
env:
  NODE_ENV: production
  APP_ENV: staging

# Secret env vars for the main container (frontend), pulled from the Kanopy ksec
# secret. Renders as a secretKeyRef with key = the env var name.
envSecrets:
  NEXT_PUBLIC_CARTO_API_KEY: leafy-ev-charging

# Service account with an AWS IAM role (IRSA). The chart injects AWS_ROLE_ARN and
# AWS_WEB_IDENTITY_TOKEN_FILE into the pod, which the AWS SDK uses to get Bedrock
# credentials for the backend sidecar. The role must allow bedrock:InvokeModel.
serviceAccount:
  enabled: true
  name: sa
  irsa:
    accountId: "275662791714"
    roleName: kanopy-staging-cicd-irsa

# Main container (frontend) resources.
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 192Mi

sidecarContainers:
  # Backend: Apollo GraphQL API. Internal only (proxied by the frontend at /graphql).
  - name: backend
    image: 795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/leafy-ev-charging-backend:latest
    env:
      - name: NODE_ENV
        value: "production"
      - name: MONGODB_DATABASE
        value: "charging_demo"
      - name: BACKEND_URL
        value: "http://localhost:4000"
      - name: BACKEND_CORS_ORIGIN
        value: "https://leafy-ev-charging.industrysolutions.staging.corp.mongodb.com"
      # AI assistants (Bedrock). Credentials come from the pod's IAM role via the
      # serviceAccount.irsa block above. AWS_PROFILE is deliberately unset: the pod
      # has no ~/.aws profile file, so the SDK uses the web identity token.
      - name: AWS_REGION
        value: "us-east-1"
      - name: BEDROCK_MODEL_ID
        value: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
      - name: MONGODB_URI
        valueFrom:
          secretKeyRef:
            name: leafy-ev-charging
            key: MONGODB_URI
    resources:
      limits:
        cpu: 1000m
        memory: 1024Mi
      requests:
        cpu: 100m
        memory: 256Mi

  # Simulator: FastAPI background worker driving demo telemetry into Atlas.
  - name: simulator
    image: 795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/leafy-ev-charging-simulator:latest
    env:
      - name: MONGODB_DATABASE
        value: "charging_demo"
      - name: SIMULATOR_URL
        value: "http://localhost:8000"
      - name: SESSION_TELEMETRY_INTERVAL_SECONDS
        value: "2"
      - name: CHANGE_STREAM_RETRY_SECONDS
        value: "2"
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 128Mi
